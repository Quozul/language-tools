[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qzl-language-detection"
version = "0.1.0"
description = "Language detection microservice (fastText / OpenLID-v3)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "fasttext-predict",
    "huggingface-hub",
    "regex",
    "pycountry",
]

[project.optional-dependencies]
# Dev/test only. Never installed into the runtime image.
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "pip-tools",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["fasttext", "pycountry"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
