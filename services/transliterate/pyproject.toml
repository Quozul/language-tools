[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qzl-transliterate"
version = "0.1.0"
description = "Text annotation microservice: furigana and romaji (PoC: Japanese)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "fugashi",
    "jaconv",
    "pydantic-settings",
]

[project.optional-dependencies]
# Dev/test only. Never installed into the runtime image.
# pykakasi is believed GPL-licensed: cross-check tool only (docs 11.5).
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
    "cutlet",
    "pykakasi",
    "pip-tools",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "config", "domain", "engine", "version"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fugashi.*", "jaconv"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
